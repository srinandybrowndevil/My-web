  <body class="bg-[#030712] text-slate-100 min-h-screen antialiased selection:bg-cyan-500 selection:text-slate-950 font-sans">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #030712; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
        <div style="position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <!-- Ambient Glow -->
          <div style="position: absolute; inset: -20px; border-radius: 9999px; background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(37, 99, 235, 0.1) 60%, transparent 80%); filter: blur(12px);"></div>
          <!-- Outer Rotating HUD Ring -->
          <div style="position: absolute; inset: 0; border-radius: 9999px; border: 2px dashed rgba(6, 182, 212, 0.35); animation: muco-spin 6s linear infinite;"></div>
          <!-- Inner Rotating Arc -->
          <div style="position: absolute; inset: 8px; border-radius: 9999px; border: 2px solid transparent; border-top-color: #22d3ee; border-left-color: rgba(59, 130, 246, 0.6); animation: muco-spin-rev 2s linear infinite;"></div>
          <!-- Central Hub -->
          <div style="position: relative; width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #22d3ee, #2563eb); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);">
            <svg width="20" height="20" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="100" cy="100" r="14" fill="#030712" />
              <circle cx="100" cy="32" r="14" fill="#030712" />
              <circle cx="100" cy="168" r="14" fill="#030712" />
              <line x1="100" y1="100" x2="100" y2="35" stroke="#030712" stroke-width="12" stroke-linecap="round" />
              <line x1="100" y1="100" x2="100" y2="165" stroke="#030712" stroke-width="12" stroke-linecap="round" />
            </svg>
          </div>
        </div>
        <div style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <div style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 9999px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(6, 182, 212, 0.3); font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #22d3ee; text-transform: uppercase;">
            <span style="width: 6px; height: 6px; border-radius: 9999px; background: #22d3ee; box-shadow: 0 0 8px #22d3ee;"></span>
            MUCO LABS CORE
          </div>
          <p style="margin: 0; font-size: 12px; font-family: monospace; color: #94a3b8; letter-spacing: 0.08em; text-transform: uppercase;">
            INITIALIZING ARCHITECTURE...
          </p>
        </div>
        <style>
          @keyframes muco-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          @keyframes muco-spin-rev { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
