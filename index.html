    <!-- Host-Aware Search Crawler Directives (Enforces NOINDEX on preview/staging/ai.studio hosts) -->

      (function() {

          var host = (window.location.hostname || '').toLowerCase();

          if (!isOfficial || host.indexOf('ai.studio') !== -1 || host.indexOf('run.app') !== -1) {
            function setRobotsTag(name) {
              var el = document.querySelector('meta[name="' + name + '"]');
              if (!el) {
                el = document.createElement('meta');
                el.setAttribute('name', name);
                document.head.appendChild(el);
              }
              el.setAttribute('content', 'noindex, nofollow, noarchive, nosnippet, noimageindex');
            }
            setRobotsTag('robots');
            setRobotsTag('googlebot');
            setRobotsTag('googlebot-news');
            setRobotsTag('bingbot');
          }
        } catch (e) {}
      })();
    </script>
